<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Par Physics Playground</title>
		<link rel="icon" href="data:," />
	</head>
	<body>
		<div id="app">
			<header id="top-bar">
				<h1>Par Physics Playground</h1>
				<button type="button" class="mat-btn sim-preset-btn" data-sim="demo" title="Load the built-in demo scene (a Rube Goldberg starter machine)">Demo scene</button>
				<button type="button" class="mat-btn sim-preset-btn" data-sim="new-world" title="Clear the world to an empty scene">New empty world</button>
				<div class="scenes-menu">
					<button type="button" class="mat-btn sim-preset-btn" data-scenes="open" aria-haspopup="true" aria-expanded="false" title="Saved scenes, JSON export and import">Scenes</button>
					<div class="scenes-panel" data-scenes-menu hidden>
						<form data-scenes="save-form">
							<input data-scenes="save-name" type="text" placeholder="Scene name" maxlength="60" aria-label="Scene name" autocomplete="off" />
							<button type="submit" class="mat-btn" data-scenes="save" title="Save the current world under this name">Save</button>
						</form>
						<ul data-scenes="list" aria-label="Saved scenes"></ul>
						<hr />
						<button type="button" class="mat-btn" data-scenes="export" title="Download the current world as a JSON file">Export JSON</button>
						<button type="button" class="mat-btn" data-scenes="import-open" title="Load a scene from a JSON file">Import JSON</button>
						<input data-scenes="import" id="scene-import" type="file" accept="application/json,.json" hidden />
					</div>
				</div>
				<div class="sim-controls" role="toolbar" aria-label="Simulation controls">
					<button type="button" class="tool-btn" data-sim="pause" aria-label="Pause simulation (P)" aria-pressed="false" title="Pause (P)">
						<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="3" width="3" height="10" rx="1" fill="currentColor"/><rect x="9" y="3" width="3" height="10" rx="1" fill="currentColor"/></svg>
					</button>
					<button type="button" class="tool-btn" data-sim="step" aria-label="Step one tick (.)" title="Step one tick (.)">
						<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3l7 5-7 5z" fill="currentColor"/><rect x="11" y="3" width="2.5" height="10" rx="1" fill="currentColor"/></svg>
					</button>
					<button type="button" class="tool-btn" data-sim="reset" aria-label="Reset world" title="Reset world">
						<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3a5 5 0 1 1-4.9 6h1.55A3.5 3.5 0 1 0 8 4.5V6L4.5 3.5 8 1z" fill="currentColor"/></svg>
					</button>
					<span class="sim-sep" aria-hidden="true"></span>
					<div class="sim-field">
						<label for="sim-gravity-angle">Gravity</label>
						<input id="sim-gravity-angle" data-sim="gravity-angle" type="range" min="0" max="359" step="1" value="0" aria-label="Gravity direction, degrees clockwise from down" />
						<output data-sim="gravity-angle-out" for="sim-gravity-angle">0°</output>
					</div>
					<div class="sim-field">
						<label for="sim-gravity-mag">Mag</label>
						<input id="sim-gravity-mag" data-sim="gravity-mag" type="range" min="0" max="25" step="0.01" value="9.81" aria-label="Gravity magnitude, metres per second squared" />
						<output data-sim="gravity-mag-out" for="sim-gravity-mag">9.81</output>
					</div>
					<span class="sim-presets">
						<button type="button" class="mat-btn sim-preset-btn" data-gravity-preset="down" title="Preset: Earth gravity, 9.81 m/s² straight down">Down</button>
						<button type="button" class="mat-btn sim-preset-btn" data-gravity-preset="zero-g" title="Preset: zero gravity — bodies drift">0g</button>
						<button type="button" class="mat-btn sim-preset-btn" data-gravity-preset="moon" title="Preset: Moon gravity, 1.62 m/s² down">Moon</button>
					</span>
					<span class="sim-sep" aria-hidden="true"></span>
					<div class="sim-field">
						<label for="sim-time-scale">Speed</label>
						<input id="sim-time-scale" data-sim="time-scale" type="range" min="0.25" max="2" step="0.05" value="1" aria-label="Time scale, from quarter speed to double speed" />
						<output data-sim="time-scale-out" for="sim-time-scale">1.00×</output>
					</div>
				</div>
			</header>
			<nav id="tool-rail" aria-label="Tools">
				<button type="button" class="tool-btn" data-tool="select" aria-label="Select tool (V)" aria-pressed="true" title="Select (V)">
					<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2l9 6-4 1-2 4z" fill="currentColor"/></svg>
				</button>
				<button type="button" class="tool-btn" data-tool="box" aria-label="Box tool (B)" aria-pressed="false" title="Box (B)">
					<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
				</button>
				<button type="button" class="tool-btn" data-tool="joint" aria-label="Joint tool (J)" aria-pressed="false" title="Joint (J) — click a body, then a second body (or empty space to anchor to world); pick the kind below">
					<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8" r="1.5" fill="currentColor"/></svg>
				</button>
				<span class="joint-kinds" data-joint-kinds hidden>
					<button type="button" class="tool-btn" data-joint-kind="pin" aria-pressed="true" title="Pin joint — free rotation about the shared pivot">
						<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8" r="1.5" fill="currentColor"/></svg>
					</button>
					<button type="button" class="tool-btn" data-joint-kind="weld" aria-pressed="false" title="Weld joint — the pair moves as one rigid unit">
						<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
					</button>
					<button type="button" class="tool-btn" data-joint-kind="rod" aria-pressed="false" title="Rod joint — the pair keeps an exact distance">
						<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 12L12 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="4" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="4" r="1.4" fill="currentColor"/></svg>
					</button>
					<button type="button" class="tool-btn" data-joint-kind="slider" aria-pressed="false" title="Slider joint — translation along one axis within limits">
						<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="2" fill="currentColor"/><path d="M4 4v8M12 4v8" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
					</button>
					<button type="button" class="tool-btn" data-joint-kind="motor" aria-pressed="false" title="Motor joint — powered rotation at a target speed; click a placed motor's marker to toggle it">
						<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8" r="1.5" fill="currentColor"/><path d="M11.6 5.2a4 4 0 0 1 0 5.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
					</button>
					<button type="button" class="tool-btn" data-joint-kind="spring" aria-pressed="false" title="Spring joint — damped oscillation between two anchors (two clicks, like the rod)">
						<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h1.5l1-2.5L7.5 10.5l2-5 1.5 2.5H13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
					</button>
					<button type="button" class="tool-btn" data-joint-kind="rope" aria-pressed="false" title="Rope — draw a stroke; Shift snaps direction (anchored at the last point); endpoints attach to bodies or the world">
						<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 11.5q2.5-5 5.5-2.5t5.5-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
					</button>
				</span>
				<button type="button" class="tool-btn" data-tool="circle" aria-label="Circle tool (C)" aria-pressed="false" title="Circle (C)">
					<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
				</button>
				<button type="button" class="tool-btn" data-tool="polygon" aria-label="Polygon tool (G)" aria-pressed="false" title="Polygon (G) — click vertices, click the first point or press Enter to close">
					<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5l5.5 4-2.1 6.5H4.6L2.5 6.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
				</button>
				<button type="button" class="tool-btn" data-tool="line" aria-label="Line tool (L)" aria-pressed="false" title="Line (L) — drag or click twice; Shift constrains to horizontal/vertical/45°">
					<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13L13 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="3" cy="13" r="1.4" fill="currentColor"/><circle cx="13" cy="3" r="1.4" fill="currentColor"/></svg>
				</button>
				<button type="button" class="tool-btn" data-tool="freehand" aria-label="Freehand tool (F)" aria-pressed="false" title="Freehand (F) — drag to draw; circles, rectangles and triangles snap clean">
					<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 11.5C4 6 6 4.5 8 7.5s4 2 5.5-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
				</button>
				<button type="button" class="tool-btn" data-tool="text" aria-label="Text tool (T)" aria-pressed="false" title="Text (T) — click to place a label, type, Enter or Escape to commit">
					<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3.5h10M8 3.5V13M5.5 13h5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
				</button>
				<button type="button" class="tool-btn" data-tool="thruster" aria-label="Thruster tool (H)" aria-pressed="false" title="Thruster (H) — click a body to mount a rocket; click its marker to toggle, tune strength in the panel">
					<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h7M10 8l-2.5-2M10 8l-2.5 2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 5.5v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
				</button>
				<span class="tool-sep" aria-hidden="true"></span>
				<button type="button" class="tool-btn" data-mode="static" aria-label="Static mode (S)" aria-pressed="false" title="Static mode (S) — box, circle, polygon, line and freehand spawns become terrain (infinite mass)">
					<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 11.5h12M2 11.5l4-5 4 3 4-6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
				</button>
				<button type="button" class="tool-btn" data-action="undo" aria-label="Undo (Cmd/Ctrl+Z)" title="Undo (Cmd/Ctrl+Z)" disabled>
					<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 3L3 6.5 6.5 10M3 6.5h6a3.5 3.5 0 0 1 0 7H6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
				</button>
				<button type="button" class="tool-btn" data-action="redo" aria-label="Redo (Cmd/Ctrl+Shift+Z)" title="Redo (Cmd/Ctrl+Shift+Z)" disabled>
					<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.5 3L13 6.5 9.5 10M13 6.5H7a3.5 3.5 0 0 0 0 7h3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
				</button>
				<button type="button" class="tool-btn" data-action="duplicate" aria-label="Duplicate selection (Ctrl/Cmd+D)" title="Duplicate (Ctrl/Cmd+D)">
					<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3 10.5V3.5A.5.5 0 0 1 3.5 3h7" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
				</button>
				<button type="button" class="tool-btn" data-action="delete" aria-label="Delete selection (Delete)" title="Delete (Delete)">
					<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1.5M4.5 4.5l.7 8a1 1 0 0 0 1 .9h3.6a1 1 0 0 0 1-.9l.7-8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
				</button>
			</nav>
			<main id="stage-area">
				<canvas id="stage"></canvas>
			</main>
			<aside id="context-panel" aria-label="Context panel"></aside>
		</div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
